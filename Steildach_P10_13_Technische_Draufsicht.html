function rectFromBounds(a){
 let minx=Math.min(...a.map(p=>p.x)),maxx=Math.max(...a.map(p=>p.x)),miny=Math.min(...a.map(p=>p.y)),maxy=Math.max(...a.map(p=>p.y));

}
function make90(a,ms){
 if(a.length!==4)return;

       let e1=lerp(a,b,t),e2=lerp(oa,ob,t),rr=lerp(m1,m2,t),P1=I(e1,0),P2=I(e2,0),R=I(rr,rise);
       line3(P1,R);line3(P2,R);

     });

   }else if(typ==="pyramid"){
     let C0={x:(a.x+b.x+oa.x+ob.x)/4,y:(a.y+b.y+oa.y+ob.y)/4},C=I(C0,rise);

     [a,b,ob,oa].forEach((p,k)=>{

     });
     // Schifter auf allen vier Dachflächen im 0,75-m-Raster.
     [[a,b],[b,ob],[ob,oa],[oa,a]].forEach((edge,ei)=>{
       let L=dist(edge[0],edge[1]),ts=axisTs(L);
       ts.slice(1,-1).forEach((t,k)=>{
         let E=lerp(edge[0],edge[1],t),P=I(E,0);

           let sl=Math.hypot(dist(E,C0),rise);

         }
       })
     });

   }else{
     let R1=I(Q.r1,rise),R2=I(Q.r2,rise);line3(R1,R2,"#b71c1c",4);
     // vier Grate
     [[a,Q.r1],[oa,Q.r1],[b,Q.r2],[ob,Q.r2]].forEach((z,k)=>{
       let P=I(z[0],0),R=I(z[1],rise);line3(P,R,"#b71c1c",3);
       if(show3Measures)lab(P,R,"Grat "+Math.hypot(dist(z[0],z[1]),rise).toFixed(2)+" m","hip",k%2?30:22)
     });

     // Hauptsparren: echte Achsen alle ca. 75 cm entlang der langen Traufe.
     let ts=axisTs(Q.len);
     ts.forEach((t,k)=>{
       let e1=lerp(a,b,t),e2=lerp(oa,ob,t);
       // Nur Achsen, deren Lot auf den First fällt; an den Walmenden übernehmen Schifter.
       let x=Q.r1.x+(Q.r2.x-Q.r1.x)*t, y=Q.r1.y+(Q.r2.y-Q.r1.y)*t, rr={x,y};
       let within=t>=((Q.len-Q.ridge)/(2*Q.len)-1e-6) && t<=1-((Q.len-Q.ridge)/(2*Q.len)-1e-6);
       if(within){
         let P1=I(e1,0),P2=I(e2,0),R=I(rr,rise);line3(P1,R);line3(P2,R);
         if(show3Measures && k===Math.floor(ts.length/2))lab(P1,R,"Sparren "+Math.hypot(dist(e1,rr),rise).toFixed(2)+" m","rafter",18);
       }
     });

     // Walm-Schifter: auf beiden Stirnseiten im 75-cm-Raster, bis zum jeweiligen Grat.
     [[a,oa,Q.r1],[b,ob,Q.r2]].forEach((set,side)=>{
       let e0=set[0],e1=set[1],ap=set[2],L=dist(e0,e1),ts2=axisTs(L);

         }
       })
     });
     if(show3Measures)lab(R1,R2,"First "+Q.ridge.toFixed(2)+" m","ridge",-28);
   }

   // Legende der technischen Zeichnung.
   if(show3Measures){
     g.save();g.fillStyle="rgba(255,255,255,.94)";g.strokeStyle="#555";g.lineWidth=1;
     g.fillRect(12,12,238,70);g.strokeRect(12,12,238,70);

     g.font="12px Arial";g.fillText("Sparrenachsmaß: ca. 0,75 m",22,51);
     g.fillText("Maße: Traufe · First · Grat · Sparren · Schifter",22,69);g.restore()
   }

 function roofZCanvas(px,py){

 parts.forEach(p=>{
