<script>

function edgeHit(p,a,closed){let n=closed?a.length:a.length-1,best=-1,bd=24;for(let i=0;i<n;i++){let A=a[i],B=a[(i+1)%a.length],vx=B.x-A.x,vy=B.y-A.y,L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,((p.x-A.x)*vx+(p.y-A.y)*vy)/L)):0,q={x:A.x+t*vx,y:A.y+t*vy},dd=dist(p,q);if(dd<bd){bd=dd;best=i}}return best}
let edgeEdit=null;

function rectFromBounds(a){
 let minx=Math.min(...a.map(p=>p.x)),maxx=Math.max(...a.map(p=>p.x)),miny=Math.min(...a.map(p=>p.y)),maxy=Math.max(...a.map(p=>p.y));
 // Preserve the user's point order/orientation, but make a true rectangle.
 let corners=[{x:minx,y:miny},{x:maxx,y:miny},{x:maxx,y:maxy},{x:minx,y:maxy}];
 let first=a[0],k=0,bd=1e9;corners.forEach((q,i)=>{let z=dist(first,q);if(z<bd){bd=z;k=i}});
 let cw=[corners[k],corners[(k+1)%4],corners[(k+2)%4],corners[(k+3)%4]];
 let cc=[corners[k],corners[(k+3)%4],corners[(k+2)%4],corners[(k+1)%4]];
 return dist(a[1],cw[1])<=dist(a[1],cc[1])?cw:cc
}
function make90(a,ms){
 if(a.length!==4)return;
 let old=a.map(p=>({...p}));lastAction.push({kind:"shape",a,old});

 a.forEach((p,i)=>Object.assign(p,pts[i]));

c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);let r=c.getBoundingClientRect(),p={x:(e.clientX-r.left-viewX)/viewScale,y:(e.clientY-r.top-viewY)/viewScale},a=d,closed=dc,ms=dm;

let parts=[],partDrag=null,partPress=null,partEdit=-1;

function partAt(pt){for(let i=parts.length-1;i>=0;i--){let q=parts[i],cx=q.x+q.w/2,cy=q.y+q.h/2,a=-(q.rot||0)*Math.PI/180,dx=pt.x-cx,dy=pt.y-cy,xx=dx*Math.cos(a)-dy*Math.sin(a),yy=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(xx)<=q.w/2&&Math.abs(yy)<=q.h/2)return i}return -1}return -1}

function fit2D(){

}

function guideGeom(){
 if(!dc||d.length!==4||!isWalm())return null;
 let minx=Math.min(...d.map(p=>p.x)),maxx=Math.max(...d.map(p=>p.x)),miny=Math.min(...d.map(p=>p.y)),maxy=Math.max(...d.map(p=>p.y));
 let cx=(minx+maxx)/2,cy=(miny+maxy)/2;
 // Simple plan guide: Walm triangle at the short end of the roof.
 let horizontal=(maxx-minx)>=(maxy-miny);
 if(horizontal)return {T:{x:minx,y:cy},F:{x:cx,y:cy},H:{x:cx,y:cy-70/viewScale}};
 return {T:{x:cx,y:miny},F:{x:cx,y:cy},H:{x:cx+70/viewScale,y:cy}}
}
function pointSegDist(p,A,B){let vx=B.x-A.x,vy=B.y-A.y,L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,((p.x-A.x)*vx+(p.y-A.y)*vy)/L)):0;return dist(p,{x:A.x+t*vx,y:A.y+t*vy})}
function triHit(p){
 let G=guideGeom();if(!G)return null;
 if(pointSegDist(p,G.T,G.F)<18/viewScale)return"run";

 return null
}

 x.fillText("Höhe"+(walmRise?" "+walmRise.toFixed(2)+" m":""),G.H.x+5/viewScale,(G.F.y+G.H.y)/2);

function roofCalc(D,typ){
 let L=D.map((p,i)=>dist(p,D[(i+1)%4])),e=(L[0]+L[2]>=L[1]+L[3])?0:1,op=(e+2)%4,a=D[e],b=D[(e+1)%4],c2=D[op],dd=D[(op+1)%4];
 let direct=dist(a,dd)+dist(b,c2),oa=direct<=dist(a,c2)+dist(b,dd)?dd:c2,ob=direct<=dist(a,c2)+dist(b,dd)?c2:dd;
 let m1={x:(a.x+oa.x)/2,y:(a.y+oa.y)/2},m2={x:(b.x+ob.x)/2,y:(b.y+ob.y)/2},axis=dist(m1,m2),span=(dist(a,oa)+dist(b,ob))/2;
 let run=(walmRun>0?walmRun:span/2),rise=(walmRise>0?walmRise:run*Math.tan(35*Math.PI/180));
 let angle=Math.atan2(rise,run)*180/Math.PI;
 let ridge=typ==="pyramid"?0:Math.max(.01,axis-2*run);
 if(typ==="gable"){angle=35;rise=span/2*Math.tan(angle*Math.PI/180);ridge=axis}
 let ux=(m2.x-m1.x)/(axis||1),uy=(m2.y-m1.y)/(axis||1),cx=(m1.x+m2.x)/2,cy=(m1.y+m2.y)/2;
 let r1={x:cx-ux*ridge/2,y:cy-uy*ridge/2},r2={x:cx+ux*ridge/2,y:cy+uy*ridge/2};
 return {a,b,oa,ob,m1,m2,r1,r2,span,axis,rise,angle,ridge}
}

function d3(){
 let W=v.clientWidth,Hh=v.clientHeight;g.clearRect(0,0,W,Hh);g.fillStyle="#f7f8f9";g.fillRect(0,0,W,Hh);

 let typ=$("#roofType").value,D=M.D,Q=roofCalc(D,typ),n=Q.angle,a=Q.a,b=Q.b,oa=Q.oa,ob=Q.ob,rise=Q.rise;

 let sc=Math.min(W/(ww+hh+2),Hh/(rise+(ww+hh)*.5+2))*.95*zoom3,mx=(minx+maxx)/2,my=(miny+maxy)/2;

 let E=D.map(p=>I(p,0)),idx=p=>D.indexOf(p),A=E[idx(a)],B=E[idx(b)],OA=E[idx(oa)],OB=E[idx(ob)];
 function face(P,fill){g.beginPath();g.moveTo(P[0].x,P[0].y);P.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle="#176b2c";g.lineWidth=2.5;g.stroke()}

   let R1=I(m1,rise),R2=I(m2,rise);face([A,B,R2,R1],"#dfe9df");face([OA,OB,R2,R1],"#edf3ed");
   g.beginPath();g.moveTo(R1.x,R1.y);g.lineTo(R2.x,R2.y);g.strokeStyle="#d32f2f";g.lineWidth=6;g.stroke()
 }else if(typ==="pyramid"){
   let C=I({x:(a.x+b.x+oa.x+ob.x)/4,y:(a.y+b.y+oa.y+ob.y)/4},rise);
   [[A,B],[B,OB],[OB,OA],[OA,A]].forEach((z,i)=>face([z[0],z[1],C],i%2?"#edf3ed":"#dfe9df"))
 }else{

   face([A,B,R2,R1],"#dfe9df");face([OA,OB,R2,R1],"#edf3ed");face([A,OA,R1],"#e7efe7");face([B,OB,R2],"#e7efe7");
   g.beginPath();g.moveTo(R1.x,R1.y);g.lineTo(R2.x,R2.y);g.strokeStyle="#d32f2f";g.lineWidth=5;g.stroke()
 }

 // Real 3D components at the same metric position as in the 2D plan.
 function projPartPoint(px,py,z){return I({x:(px/PX)+(Math.min(...d.map(q=>q.x))/PX),y:(py/PX)+(Math.min(...d.map(q=>q.y))/PX)},z)}

 function poly(P,fill,stroke="#555"){g.beginPath();g.moveTo(P[0].x,P[0].y);P.slice(1).forEach(q=>g.lineTo(q.x,q.y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}
 parts.forEach(p=>{
   let cx=p.x+p.w/2,cy=p.y+p.h/2,ra=(p.rot||0)*Math.PI/180,co=Math.cos(ra),si=Math.sin(ra);
   const RC=(lx,ly)=>({x:cx+lx*co-ly*si,y:cy+lx*si+ly*co});
   let C0=RC(-p.w/2,-p.h/2),C1=RC(p.w/2,-p.h/2),C2=RC(p.w/2,p.h/2),C3=RC(-p.w/2,p.h/2);
   let x0=C0.x,y0=C0.y,x1=C1.x,y1=C1.y,x2=C2.x,y2=C2.y,x3=C3.x,y3=C3.y;
   let z00=roofZCanvas(x0,y0),z10=roofZCanvas(x1,y1),z11=roofZCanvas(x2,y2),z01=roofZCanvas(x3,y3),z0=(z00+z10+z11+z01)/4,z1=z0+Math.max(.05,p.H||.5);
   let q0=PP(x0,y0,z00),q1=PP(x1,y1,z10),q2=PP(x2,y2,z11),q3=PP(x3,y3,z01);
   if(p.type==="chimney"){
     let t0=PP(x0,y0,z1),t1=PP(x1,y0,z1),t2=PP(x1,y1,z1),t3=PP(x0,y1,z1);
     poly([q0,q1,t1,t0],"#8d6e63");poly([q1,q2,t2,t1],"#795548");poly([q2,q3,t3,t2],"#6d4c41");poly([t0,t1,t2,t3],"#a1887f")

     }else{

       let tf=frontBase+H,tr=Math.max(rearBase+.08,frontBase+H*.55),t0=PP(x0,y0,tf),t1=PP(x1,y0,tf),t2=PP(x1,y1,tr),t3=PP(x0,y1,tr);
       poly([b0,b1,t1,t0],"#ddd");poly([b1,b2,t2,t1],"#d5d5d5");poly([b3,b0,t0,t3],"#d5d5d5");poly([t0,t1,t2,t3],"#c8d8c8")
     }
   }else if(p.type==="roof"){
     let rt=p.roofType||"gable",sl=(p.slope||35)*Math.PI/180,span=(p.h/PX),rr=Math.tan(sl)*span/2,base=Math.max(0,p.H||0);
     let A0=PP(x0,y0,base),A1=PP(x1,y0,base),A2=PP(x1,y1,base),A3=PP(x0,y1,base);
     if(rt==="pyramid"){
       let C=PP((x0+x1)/2,(y0+y1)/2,base+rr);poly([A0,A1,C],"#d8e4d8");poly([A1,A2,C],"#edf3ed");poly([A2,A3,C],"#d8e4d8");poly([A3,A0,C],"#edf3ed")
     }else{
       let rA=PP(x0,(y0+y1)/2,base+rr),rB=PP(x1,(y0+y1)/2,base+rr);
       poly([A0,A1,rB,rA],"#d8e4d8","#176b2c");poly([A3,A2,rB,rA],"#edf3ed","#176b2c");
       if(rt==="hip"||rt==="halfhip"){ /* visible as own roof object; detailed hip geometry follows later */ }
       g.beginPath();g.moveTo(rA.x,rA.y);g.lineTo(rB.x,rB.y);g.strokeStyle="#d32f2f";g.lineWidth=4;g.stroke()
     }
   }
 });

 let names={gable:"Satteldach",hip:"Walmdach",halfhip:"Krüppelwalmdach",pyramid:"Zeltdach"};
 g.fillStyle="#17202a";g.font="bold 15px Arial";g.fillText(names[typ]+" · "+n.toFixed(1)+"°"+((typ==="hip"||typ==="halfhip")?" · First "+Q.ridge.toFixed(2)+" m":""),16,Hh-48);g.font="14px Arial";g.fillText("Ansicht: oben / seitlich · Ziehen = drehen · 2 Finger = zoomen",16,Hh-24)
}
